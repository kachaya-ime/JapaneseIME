plugins {
    id 'java'
    id 'application'
    alias(libs.plugins.kotlin.jvm)
}

dependencies {
    implementation libs.sqlite.jdbc
}

application {
    mainClass.set('io.github.kachaya.ime.DictBuilder')
}

jar {
    manifest {
        attributes 'Main-Class': 'io.github.kachaya.ime.DictBuilder'
    }
    from {
        configurations.runtimeClasspath.files.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs "-Dfile.encoding=UTF-8"
}

tasks.register('runDictBuilder', JavaExec) {
    group = 'application'
    description = 'Runs the DictBuilder tool'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('io.github.kachaya.ime.DictBuilder')
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
